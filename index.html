<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Kral Trade</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B0B0B] text-white flex flex-col items-center justify-center min-h-screen font-sans">
    
    <div id="king-crown" class="mb-6 drop-shadow-[0_0_15px_rgba(212,175,55,0.7)] animate-pulse">
        <span style="font-size: 80px;">👑</span>
    </div>

    <h1 class="text-4xl font-bold text-[#D4AF37] mb-2 tracking-widest">MEME KRAL</h1>
    <p class="text-gray-400 mb-8 italic">"Tahtını kur, kazancını analiz et."</p>

    <button id="tap-btn" class="w-48 h-48 rounded-full bg-gradient-to-b from-[#D4AF37] to-[#8B7500] border-4 border-[#FFD700] shadow-[0_0_30px_rgba(212,175,55,0.4)] hover:scale-105 active:scale-95 transition-all flex items-center justify-center mb-10">
        <span class="text-6xl text-white drop-shadow-lg">💰</span>
    </button>

    <div class="w-80 p-4 bg-[#1A1A1A] border border-[#D4AF37] rounded-xl shadow-inner">
        <input type="text" placeholder="Solana CA Yapıştır..." class="w-full bg-transparent text-[#D4AF37] outline-none text-center mb-3">
        <button class="w-full bg-[#D4AF37] text-black font-bold py-2 rounded-lg hover:bg-[#FFD700] transition-colors">KRAL ANALİZ</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
