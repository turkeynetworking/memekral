<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meme Kral VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }
        .animate-float { animation: float 0.7s ease-out forwards; }
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; overflow: hidden; height: 100vh; }
        /* Klavye açılınca kaymayı önleyen sabitleyici */
        .safe-area { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
    </style>
</head>
<body>

    <div class="safe-area">
        <div class="w-full flex justify-between items-center px-4 py-2 border-b border-[#D4AF37]/20">
            <span class="text-xl">👑</span>
            <div class="text-[#D4AF37] font-bold">SCORE: <span id="score">0</span></div>
        </div>

        <div class="relative">
            <button onclick="handleTap(event)" class="w-48 h-48 rounded-full bg-black border-4 border-[#D4AF37] shadow-[0_0_20px_rgba(212,175,55,0.3)] active:scale-90 transition-transform flex items-center justify-center">
                <span class="text-6xl">💰</span>
            </button>
            <div id="anim-container" class="absolute inset-0 pointer-events-none"></div>
        </div>

        <div class="w-full max-w-xs bg-[#111] border border-[#D4AF37]/30 p-4 rounded-2xl mb-4">
            <h2 class="text-[#D4AF37] text-[10px] font-bold mb-2">SOLANA ANALİZ (v2.5)</h2>
            <input type="text" id="caInput" placeholder="CA Yapıştır..." 
                class="w-full bg-black border border-gray-800 rounded-lg py-3 px-3 text-sm text-[#D4AF37] outline-none mb-3">
            <button onclick="startAnalysis()" id="mainBtn" class="w-full bg-[#D4AF37] text-black font-bold py-3 rounded-lg uppercase text-xs">
                ANALİZ ET & RAPOR AL
            </button>
        </div>
    </div>

    <div id="modal" style="display:none;" class="fixed inset-0 bg-black/95 z-[999] flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-[#111] border border-[#D4AF37] p-6 rounded-3xl w-full">
            <div class="text-4xl mb-2">🛡️</div>
            <h3 class="text-[#D4AF37] font-bold mb-4">ANALİZ TAMAMLANDI</h3>
            <div class="text-left text-xs space-y-2 bg-black/40 p-4 rounded-xl border border-white/5 mb-6">
                <p>✅ <span class="text-gray-400">Balina Durumu:</span> Hareketli</p>
                <p>✅ <span class="text-gray-400">Likidite:</span> %92 Kilitli</p>
                <p>⚠️ <span class="text-red-500 font-bold italic">BÜYÜK RİSK: Dev cüzdanı satmaya hazır!</span></p>
            </div>
            <button onclick="closeModal()" class="w-full bg-white/5 py-3 rounded-xl mb-2">KAPAT</button>
            <button onclick="alert('Stars Ödemesi Yakında!')" class="w-full bg-[#D4AF37] text-black py-3 rounded-xl font-bold">50 ⭐ VIP RAPOR</button>
        </div>
    </div>

    <script>
        let count = 0;
        function handleTap(e) {
            count += 10;
            document.getElementById('score').innerText = count;
            
            // Puan Uçurma
            const floating = document.createElement('div');
            floating.innerText = "+10";
            floating.className = "absolute text-[#D4AF37] font-bold animate-float";
            floating.style.left = "50%";
            floating.style.top = "20%";
            document.getElementById('anim-container').appendChild(floating);
            setTimeout(() => floating.remove(), 700);
        }

        function startAnalysis() {
            const val = document.getElementById('caInput').value;
            if(val.length < 5) { alert("CA Gir Kral!"); return; }

            const btn = document.getElementById('mainBtn');
            btn.innerText = "AĞA BAĞLANILIYOR...";
            btn.disabled = true;

            // Simüle edilmiş Dexscreener/Solana Bağlantısı
            setTimeout(() => {
                document.getElementById('modal').style.display = 'flex';
                btn.innerText = "ANALİZ ET & RAPOR AL";
                btn.disabled = false;
            }, 2000);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
