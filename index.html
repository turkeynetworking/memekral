<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEME KRAL | PROFIT EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: rgba(255, 215, 0, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .gold-glow { text-shadow: 0 0 10px #D4AF37; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { animation: marquee 20s linear infinite; }
        .vip-card { background: linear-gradient(135deg, #000 0%, #1a1a1a 100%); border: 1px solid #D4AF37; }
    </style>
</head>
<body class="flex flex-col items-center select-none">

    <div class="w-full py-1 bg-[#D4AF37] text-black overflow-hidden whitespace-nowrap z-50">
        <div class="inline-block animate-marquee text-[10px] font-black tracking-widest uppercase italic">
            SOLANA MAINNET CONNECTED • WHALE MOVEMENTS DETECTED • BUY $SOL • MEME KRAL v6.0 • EARN STARS NOW!
        </div>
    </div>

    <header class="w-full p-4 flex justify-between items-center z-50">
        <div class="flex flex-col">
            <h1 class="font-['Orbitron'] text-sm font-black text-[#D4AF37] gold-glow uppercase">MEME KRAL</h1>
            <div class="flex gap-2 mt-1">
                <button onclick="setLang('tr')" class="opacity-70 hover:opacity-100">🇹🇷</button>
                <button onclick="setLang('en')" class="opacity-70 hover:opacity-100">🇺🇸</button>
            </div>
        </div>
        <div class="flex gap-2">
            <div class="glass px-3 py-2 rounded-xl text-[11px] font-bold text-[#0088cc] border-[#0088cc]/40">⭐ <span id="stars-val">100</span></div>
            <div class="glass px-3 py-2 rounded-xl text-[11px] font-bold text-[#D4AF37]">SOL: <span id="sol-price">0.00</span></div>
        </div>
    </header>

    <div class="w-[92%] glass rounded-3xl p-4 mt-2">
        <div class="flex justify-between items-center mb-3">
            <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Live Market Intelligence</span>
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
        </div>
        <div id="radar-box" class="space-y-2">
            <div class="flex justify-between text-[11px] bg-white/5 p-3 rounded-xl border-l-4 border-[#D4AF37]">
                <span class="font-bold">SOL/USDT</span>
                <span id="sol-live-val" class="text-[#D4AF37] font-black">WAITING...</span>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center w-full">
        <div id="score-val" class="text-5xl font-['Orbitron'] font-black text-[#D4AF37] mb-6 drop-shadow-lg">0</div>
        <button onclick="handleTap(event)" class="w-48 h-48 rounded-full bg-black border-[8px] border-[#D4AF37] shadow-[0_0_50px_rgba(212,175,55,0.3)] flex items-center justify-center text-7xl active:scale-95 transition-all">
            👑
        </button>
    </main>

    <footer class="w-full px-6 pb-8 space-y-4 z-50">
        <div class="glass rounded-[30px] p-1.5 flex border-2 border-[#D4AF37]/40 shadow-xl">
            <input type="text" id="caInput" placeholder="SOLANA CA (WIF, BONK...)" 
                class="flex-1 bg-transparent border-none outline-none px-4 py-3 text-xs text-[#D4AF37] font-black uppercase placeholder:text-gray-700">
            <button onclick="realAnaliz()" class="bg-[#D4AF37] text-black px-6 py-3 rounded-[25px] font-black text-[10px] uppercase">ANALİZ</button>
        </div>
        
        <div class="w-full h-12 glass rounded-2xl flex items-center justify-center border-dashed border-[#D4AF37]/30">
            <span class="text-[9px] text-gray-600 font-bold tracking-widest uppercase">AD SPACE: CONTACT @KING FOR PROMO</span>
        </div>
    </footer>

    <div id="modal" style="display:none;" class="fixed inset-0 bg-black/98 z-[100] flex items-center justify-center p-8 backdrop-blur-3xl">
        <div class="vip-card p-8 rounded-[40px] w-full max-w-sm shadow-[0_0_100px_rgba(212,175,55,0.1)]">
            <div id="modal-content" class="text-center">
                </div>
            <button onclick="document.getElementById('modal').style.display='none'" class="w-full bg-white/5 py-4 rounded-2xl mt-4 font-bold text-[10px] text-gray-500 uppercase">KAPAT</button>
        </div>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('kralScore') || 0);
        let stars = parseInt(localStorage.getItem('kralStars') || 100);
        let lang = localStorage.getItem('kralLang') || 'tr';

        const i18n = {
            tr: { analyze: "SORGULANIYOR...", vip: "BALİNA CÜZDANLARI (VIP)", buy: "50 ⭐ İLE RAPORU AÇ", info: "Likitide: KİLİTLİ ✅" },
            en: { analyze: "ANALYZING...", vip: "WHALE WALLETS (VIP)", buy: "OPEN REPORT (50 ⭐)", info: "Liquidity: LOCKED ✅" }
        };

        function setLang(l) { lang = l; localStorage.setItem('kralLang', l); location.reload(); }

        function handleTap(e) {
            score += 10;
            document.getElementById('score-val').innerText = score;
            localStorage.setItem('kralScore', score);
        }

        // SOLANA FİYAT MOTORU (Fixlendi)
        async function fetchSol() {
            try {
                // Alternatif API (CoinGecko Simple)
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd');
                const data = await res.json();
                const p = data.solana.usd;
                document.getElementById('sol-price').innerText = p.toFixed(2);
                document.getElementById('sol-live-val').innerText = '$' + p.toFixed(2);
            } catch (e) {
                console.log("Fiyat hatası.");
            }
        }

        async function realAnaliz() {
            const ca = document.getElementById('caInput').value.trim();
            if(ca.length < 32) return;
            const content = document.getElementById('modal-content');
            document.getElementById('modal').style.display = 'flex';
            content.innerHTML = `<p class="text-xs">${i18n[lang].analyze}</p>`;

            try {
                const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
                const data = await res.json();
                if(data.pairs && data.pairs[0]) {
                    const p = data.pairs[0];
                    content.innerHTML = `
                        <h2 class="text-[#D4AF37] font-black text-xl mb-4">${p.baseToken.symbol} ANALİZ</h2>
                        <div class="space-y-3 text-left text-[11px] bg-white/5 p-4 rounded-2xl border border-white/10">
                            <div class="flex justify-between"><span>PRICE:</span><span class="text-green-500">$${parseFloat(p.priceUsd).toFixed(6)}</span></div>
                            <div class="flex justify-between"><span>M.CAP:</span><span class="text-white">$${p.fdv ? p.fdv.toLocaleString() : "???"}</span></div>
                            <div class="flex justify-between"><span>SECURITY:</span><span class="text-green-500 font-bold">${i18n[lang].info}</span></div>
                        </div>
                        <div class="mt-6 p-4 border border-[#0088cc]/30 rounded-2xl bg-[#0088cc]/5">
                            <p class="text-[10px] text-[#0088cc] font-bold mb-3 uppercase tracking-tighter">${i18n[lang].vip}</p>
                            <button onclick="buyVIP()" class="w-full bg-[#0088cc] text-white py-3 rounded-xl font-black text-[10px] uppercase">${i18n[lang].buy}</button>
                        </div>
                    `;
                }
            } catch (e) { content.innerHTML = "HATA!"; }
        }

        function buyVIP() {
            if(stars >= 50) {
                stars -= 50;
                localStorage.setItem('kralStars', stars);
                document.getElementById('stars-val').innerText = stars;
                alert("VIP ANALİZ: 3 Balina cüzdanı son 1 saatte %5 satış yaptı. Dikkatli ol!");
            } else {
                alert("Yetersiz Stars! Bot sahibine ulaş.");
            }
        }

        setInterval(fetchSol, 10000);
        fetchSol();
        document.getElementById('score-val').innerText = score;
        document.getElementById('stars-val').innerText = stars;
    </script>
</body>
</html>
