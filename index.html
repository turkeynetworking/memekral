<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEME KRAL | ANALYTICS PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: rgba(255, 215, 0, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .gold-glow { text-shadow: 0 0 20px #D4AF37; }
        .royal-border { border: 2px solid #D4AF37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        @keyframes pulse-gold { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .live-dot { animation: pulse-gold 2s infinite; }
    </style>
</head>
<body class="flex flex-col items-center select-none">

    <div class="w-full bg-[#D4AF37] text-black py-1 overflow-hidden whitespace-nowrap z-50 shadow-lg">
        <div class="inline-block animate-[marquee_20s_linear_infinite] text-[10px] font-black uppercase italic tracking-tighter">
            SOLANA MAINNET CONNECTED • WHALE WATCH ACTIVE • $SOL PRICE STABLE • KING'S ANALYSIS ENGINE v9.0 ONLINE • 👑
        </div>
    </div>

    <header class="w-full p-5 flex justify-between items-center z-50">
        <div class="flex flex-col">
            <h1 class="font-['Orbitron'] text-sm gold-glow font-black italic">MEME KRAL</h1>
            <div class="flex gap-2 mt-1 opacity-50">
                <button onclick="setLang('tr')" class="text-xs">TR</button>
                <button onclick="setLang('en')" class="text-xs">EN</button>
            </div>
        </div>
        <div class="flex gap-2">
            <div class="glass px-3 py-2 rounded-2xl text-[11px] font-bold border-[#0088cc]/30 text-[#0088cc]">⭐ <span id="stars-top">100</span></div>
            <div class="glass px-3 py-2 rounded-2xl text-[11px] font-bold border-[#D4AF37]/30 text-[#D4AF37]">SOL: <span id="sol-top">...</span></div>
        </div>
    </header>

    <div id="radar-screen" class="w-[92%] glass rounded-[30px] p-5 mt-2 min-h-[140px] flex flex-col justify-center border-[#D4AF37]/10">
        <div id="status-text" class="text-center">
            <div class="text-3xl mb-2 opacity-20">📡</div>
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Analiz İçin Aşağıya CA Yapıştırın</p>
        </div>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center w-full">
        <div id="score" class="text-5xl font-['Orbitron'] font-black text-[#D4AF37] mb-8 drop-shadow-2xl">0</div>
        <button onclick="handleTap(event)" class="w-44 h-44 rounded-full bg-black border-[7px] border-[#D4AF37] shadow-[0_0_60px_rgba(212,175,55,0.3)] flex items-center justify-center text-7xl active:scale-95 transition-all">👑</button>
    </main>

    <footer class="w-full px-6 pb-12 space-y-4">
        <div class="glass rounded-[35px] p-1.5 flex royal-border">
            <input type="text" id="caInput" placeholder="SOLANA CONTRACT (CA)..." 
                class="flex-1 bg-transparent border-none outline-none px-5 py-3.5 text-xs text-[#D4AF37] font-black uppercase placeholder:text-gray-700">
            <button onclick="runAnalysis()" class="bg-[#D4AF37] text-black px-8 py-3.5 rounded-[30px] font-black text-[11px] uppercase active:opacity-70 transition-all">ANALİZ</button>
        </div>
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = parseInt(localStorage.getItem('kScore') || 0);
        let stars = parseInt(localStorage.getItem('kStars') || 100);

        function handleTap(e) {
            score += 10;
            document.getElementById('score').innerText = score;
            localStorage.setItem('kScore', score);
        }

        async function fetchPrices() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('sol-top').innerText = '$' + data.solana.usd.toFixed(2);
            } catch(e) {}
        }

        async function runAnalysis() {
            const ca = document.getElementById('caInput').value.trim();
            const screen = document.getElementById('radar-screen');
            
            if(ca.length < 32) {
                tg.showAlert("Geçersiz Solana Adresi! (CA)");
                return;
            }

            screen.innerHTML = `<div class="text-center"><div class="live-dot text-2xl">📡</div><p class="text-[10px] mt-2 font-bold animate-pulse text-[#D4AF37]">AĞ TARANIYOR...</p></div>`;

            try {
                const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
                const data = await res.json();

                if(data.pairs && data.pairs.length > 0) {
                    const p = data.pairs[0];
                    screen.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h2 class="text-xl font-black text-[#D4AF37] leading-none">${p.baseToken.symbol}</h2>
                                <p class="text-[9px] text-gray-500 font-bold uppercase">${p.baseToken.name}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[14px] font-black text-green-500 italic">$${parseFloat(p.priceUsd).toFixed(6)}</p>
                                <p class="text-[8px] text-gray-400 font-bold uppercase">Anlık Fiyat</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
                                <p class="text-[8px] text-gray-500 font-bold uppercase mb-1">Market Cap</p>
                                <p class="text-[11px] font-black text-white">$${p.fdv ? p.fdv.toLocaleString() : "???"}</p>
                            </div>
                            <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
                                <p class="text-[8px] text-gray-500 font-bold uppercase mb-1">Likitide (LP)</p>
                                <p class="text-[11px] font-black text-white">$${p.liquidity ? p.liquidity.usd.toLocaleString() : "KİLİTLİ"}</p>
                            </div>
                        </div>
                    `;
                } else {
                    screen.innerHTML = `<div class="text-center text-red-500 font-bold text-xs italic">TOKEN BULUNAMADI! <br> <span class="text-[8px] text-gray-500">(Yeni çıkmış olabilir, 1 dk sonra tekrar dene)</span></div>`;
                }
            } catch (e) {
                screen.innerHTML = `<div class="text-center text-red-500 font-bold text-xs italic">API HATASI!</div>`;
            }
        }

        setInterval(fetchPrices, 20000);
        fetchPrices();
        document.getElementById('score').innerText = score;
        document.getElementById('stars-top').innerText = stars;
    </script>
</body>
</html>
