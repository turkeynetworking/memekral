<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEME KRAL | MERCHANT v8.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .gold-glow { text-shadow: 0 0 15px #D4AF37; }
        .btn-star { background: linear-gradient(90deg, #0088cc, #00d4ff); }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .scanner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent, #D4AF37, transparent); height: 2px; animation: scan 2s linear infinite; }
    </style>
</head>
<body class="flex flex-col items-center select-none">

    <div class="w-full bg-[#D4AF37] text-black text-[9px] font-black py-1 px-4 flex justify-between uppercase">
        <span>Network Active: 1,420 Users</span>
        <span>Solana Mainnet: Stable</span>
    </div>

    <header class="w-full p-4 flex justify-between items-center z-50">
        <div class="flex flex-col">
            <h1 class="font-['Orbitron'] text-sm gold-glow">MEME KRAL <span class="text-white text-[8px]">v8.0</span></h1>
            <div class="flex gap-2 mt-1">
                <button onclick="changeLang('tr')" class="text-xs">🇹🇷</button>
                <button onclick="changeLang('en')" class="text-xs">🇺🇸</button>
            </div>
        </div>
        <div class="flex gap-2">
            <div onclick="openStore()" class="glass px-3 py-2 rounded-xl flex items-center gap-2 border-[#0088cc]/50">
                <span class="text-[#0088cc] text-[10px]">⭐</span>
                <span id="star-count" class="font-bold text-xs">100</span>
            </div>
            <div class="glass px-3 py-2 rounded-xl text-[10px] font-bold text-[#D4AF37]">
                SOL: <span id="sol-val">...</span>
            </div>
        </div>
    </header>

    <div class="w-[90%] glass rounded-3xl p-4 mb-2 flex justify-around">
        <div class="text-center">
            <p class="text-[8px] text-gray-500 uppercase font-bold">Ekibin</p>
            <p class="text-xs font-bold">248 Kişi</p>
        </div>
        <div class="w-[1px] bg-white/10"></div>
        <div class="text-center">
            <p class="text-[8px] text-gray-500 uppercase font-bold">Haftalık Kazanç</p>
            <p class="text-xs font-bold text-green-500">14.2 SOL</p>
        </div>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center relative">
        <div id="score" class="text-5xl font-['Orbitron'] font-black text-[#D4AF37] mb-6">0</div>
        <button onclick="handleTap(event)" class="w-48 h-48 rounded-full bg-black border-[6px] border-[#D4AF37] shadow-[0_0_50px_rgba(212,175,55,0.2)] flex items-center justify-center text-7xl active:scale-90 transition-all z-10">
            👑
        </button>
    </main>

    <footer class="w-full px-6 pb-12 space-y-4">
        <div class="glass rounded-[30px] p-1 flex border-2 border-[#D4AF37]/30">
            <input type="text" id="caInput" placeholder="CA ADRESS..." class="flex-1 bg-transparent border-none outline-none p-3 text-xs text-[#D4AF37] font-bold uppercase placeholder:text-gray-700">
            <button onclick="startAnalysis()" class="bg-[#D4AF37] text-black px-6 py-2 rounded-[25px] font-black text-[10px] uppercase">ANALİZ</button>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
            <button onclick="copyRef()" class="glass py-3.5 rounded-2xl text-[10px] font-bold text-white uppercase tracking-widest">NETWORK 🔗</button>
            <button onclick="window.open('https://e-girisimci.com')" class="glass py-3.5 rounded-2xl text-[10px] font-bold text-[#D4AF37] border-[#D4AF37]/30 uppercase">E-GİRİŞİMCİ 🚀</button>
        </div>
    </footer>

    <div id="store-modal" style="display:none;" class="fixed inset-0 bg-black/98 z-[100] flex items-center justify-center p-8 backdrop-blur-3xl">
        <div class="glass p-8 rounded-[40px] w-full max-w-sm border-2 border-[#0088cc] text-center">
            <div class="text-4xl mb-4">⭐</div>
            <h2 class="text-xl font-black mb-1">STARS MAĞAZASI</h2>
            <p class="text-[10px] text-gray-400 mb-6 uppercase">Hemen VIP Analiz İçin Yıldız Al</p>
            
            <div class="space-y-3">
                <button onclick="buyStars(50)" class="w-full btn-star py-4 rounded-2xl font-black text-xs flex justify-between px-6">
                    <span>50 STARS</span> <span>₺...</span>
                </button>
                <button onclick="buyStars(250)" class="w-full border border-white/10 py-4 rounded-2xl font-black text-xs flex justify-between px-6">
                    <span>250 STARS</span> <span>₺...</span>
                </button>
            </div>
            <button onclick="document.getElementById('store-modal').style.display='none'" class="mt-8 text-gray-600 text-[10px] font-bold uppercase underline">GERİ DÖN</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let score = parseInt(localStorage.getItem('kScore') || 0);
        let stars = parseInt(localStorage.getItem('kStars') || 100);

        function handleTap(e) {
            score += 10;
            document.getElementById('score').innerText = score;
            localStorage.setItem('kScore', score);
        }

        async function fetchPrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('sol-val').innerText = '$' + data.solana.usd.toFixed(2);
            } catch(e) {}
        }

        function openStore() { document.getElementById('store-modal').style.display = 'flex'; }
        
        function buyStars(amount) {
            tg.showConfirm(`${amount} Stars almak istiyor musun?`, (ok) => {
                if(ok) alert("Ödeme Ekranı Hazırlanıyor...");
            });
        }

        setInterval(fetchPrice, 15000);
        fetchPrice();
        document.getElementById('score').innerText = score;
        document.getElementById('star-count').innerText = stars;
    </script>
</body>
</html>
