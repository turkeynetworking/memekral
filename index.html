<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEME KRAL | VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .gold-glow { text-shadow: 0 0 15px #D4AF37; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .active-tab { color: #D4AF37; border-top: 3px solid #D4AF37; }
        .tap-btn:active { transform: scale(0.92); }
    </style>
</head>
<body class="flex flex-col items-center">

    <header class="w-full p-5 flex justify-between items-center glass">
        <div class="flex flex-col">
            <h1 class="font-['Orbitron'] text-sm gold-glow font-black italic">MEME KRAL</h1>
            <div class="flex gap-2 mt-1 text-[10px] font-bold">
                <button onclick="changeLang('tr')" id="btn-tr" class="text-[#D4AF37]">TR</button>
                <button onclick="changeLang('en')" id="btn-en" class="opacity-30">EN</button>
            </div>
        </div>
        <div class="text-right">
            <span id="lbl-points" class="text-[9px] text-gray-500 font-bold uppercase">KRAL PUANI</span>
            <p id="score" class="text-xl font-black text-[#D4AF37]">0</p>
        </div>
    </header>

    <main class="flex-1 w-full overflow-y-auto pb-24">
        
        <div id="tab-game" class="h-full flex flex-col items-center justify-center space-y-8 p-6">
            <button onclick="handleTap()" class="tap-btn w-52 h-52 rounded-full bg-black border-[8px] border-[#D4AF37] shadow-[0_0_50px_rgba(212,175,55,0.3)] text-8xl">👑</button>
            <p id="lbl-tap" class="text-[10px] text-gray-500 font-bold uppercase tracking-[0.3em] animate-pulse">Analiz İçin Dokun</p>
        </div>

        <div id="tab-analiz" class="hidden p-6 space-y-4">
            <h2 id="lbl-radar" class="text-center font-['Orbitron'] text-[#D4AF37] text-lg">BALİNA RADARI</h2>
            <div class="glass p-5 rounded-[30px] space-y-4">
                <input type="text" id="caInput" placeholder="SOLANA CA..." class="w-full bg-transparent border-b border-[#D4AF37]/30 p-3 text-xs outline-none text-[#D4AF37]">
                <button onclick="runAnalysis()" id="btn-scan" class="w-full bg-[#D4AF37] text-black py-4 rounded-2xl font-black text-xs uppercase">TARAMAYI BAŞLAT</button>
            </div>
            <div id="analiz-result" class="space-y-3"></div>
        </div>

        <div id="tab-network" class="hidden p-6 space-y-6">
            <h2 id="lbl-net" class="text-center font-['Orbitron'] text-[#D4AF37] text-lg">EKİP YÖNETİMİ</h2>
            <div class="glass p-6 rounded-[35px] text-center space-y-4 border-dashed border-[#D4AF37]/50">
                <p id="lbl-ref" class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Referans Linkin</p>
                <div class="bg-black/40 p-3 rounded-xl border border-white/5 text-[10px] text-[#D4AF37] break-all font-mono" id="refLink">Yükleniyor...</div>
                <button onclick="copyRef()" id="btn-copy" class="w-full bg-white text-black py-3 rounded-2xl font-black text-[10px] uppercase">LİNKİ KOPYALA</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-2xl text-center">
                    <p id="lbl-team" class="text-[8px] text-gray-500 uppercase font-bold">Ekip</p>
                    <p class="text-xl font-black">24</p>
                </div>
                <div class="glass p-4 rounded-2xl text-center">
                    <p id="lbl-earn" class="text-[8px] text-gray-500 uppercase font-bold">Kazanç</p>
                    <p class="text-xl font-black text-green-500">2.4 SOL</p>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 w-[90%] glass rounded-[35px] p-2 flex justify-around items-center z-50">
        <button onclick="showTab('game')" id="nav-game" class="p-4 text-xl active-tab">🏠</button>
        <button onclick="showTab('analiz')" id="nav-analiz" class="p-4 text-xl opacity-40">📡</button>
        <button onclick="showTab('network')" id="nav-network" class="p-4 text-xl opacity-40">👥</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- KULLANICIYI TANI VE REF LİNKİNİ OLUŞTUR ---
        const user = tg.initDataUnsafe?.user || {};
        const userId = user.id || "000000";
        // Kendi botunun kullanıcı adını buraya yaz kanka (başına @ koyma)
        const botUser = "memekralbot"; 
        const refUrl = `t.me/${botUser}?start=${userId}`;
        document.getElementById('refLink').innerText = refUrl;

        // PUANLAMA
        let score = parseInt(localStorage.getItem('kScore') || 0);
        document.getElementById('score').innerText = score.toLocaleString();

        const langData = {
            tr: { points: "KRAL PUANI", tap: "Analiz İçin Dokun", radar: "BALİNA RADARI", scan: "TARAMAYI BAŞLAT", net: "EKİP YÖNETİMİ", ref: "Referans Linkin", copy: "LİNKİ KOPYALA", team: "Ekip", earn: "Kazanç" },
            en: { points: "KING POINTS", tap: "Tap for Analysis", radar: "WHALE RADAR", scan: "START SCAN", net: "NETWORK", ref: "Referral Link", copy: "COPY LINK", team: "Team", earn: "Earnings" }
        };

        function changeLang(l) {
            Object.keys(langData[l]).forEach(key => {
                const el = document.getElementById('lbl-' + key) || document.getElementById('btn-' + key);
                if(el) el.innerText = langData[l][key];
            });
            document.getElementById('btn-tr').classList.toggle('opacity-30', l !== 'tr');
            document.getElementById('btn-en').classList.toggle('opacity-30', l !== 'en');
        }

        function handleTap() {
            score += 10;
            document.getElementById('score').innerText = score.toLocaleString();
            localStorage.setItem('kScore', score);
            tg.HapticFeedback.impactOccurred('medium');
        }

        function showTab(t) {
            ['game', 'analiz', 'network'].forEach(id => {
                document.getElementById('tab-' + id).classList.add('hidden');
                document.getElementById('nav-' + id).classList.remove('active-tab');
                document.getElementById('nav-' + id).classList.add('opacity-40');
            });
            document.getElementById('tab-' + t).classList.remove('hidden');
            document.getElementById('nav-' + t).classList.add('active-tab');
            document.getElementById('nav-' + t).classList.remove('opacity-40');
        }

        async function runAnalysis() {
            const ca = document.getElementById('caInput').value;
            const resDiv = document.getElementById('analiz-result');
            if(!ca) return;
            resDiv.innerHTML = `<p class="text-center text-[10px] animate-pulse">TARANIYOR...</p>`;
            try {
                const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
                const d = await r.json();
                const p = d.pairs[0];
                resDiv.innerHTML = `
                    <div class="glass p-4 rounded-2xl border-l-4 border-[#D4AF37]">
                        <div class="flex justify-between font-black italic"><span>${p.baseToken.symbol}</span><span class="text-green-500">$${p.priceUsd}</span></div>
                        <div class="text-[9px] text-gray-500 mt-1 uppercase font-bold">Mkt Cap: $${p.fdv.toLocaleString()}</div>
                    </div>`;
            } catch(e) { resDiv.innerHTML = "Hata oluştu!"; }
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('refLink').innerText);
            tg.showAlert("Link kopyalandı! Şimdi 3,5 milyonu eritme vakti kanka.");
        }
    </script>
</body>
</html>
