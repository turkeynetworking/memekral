<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEME KRAL VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        .gold-border { border: 1px solid #D4AF37; }
        .gold-text { color: #D4AF37; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .tap-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="flex flex-col items-center">

    <div class="w-full p-4 flex justify-between items-center z-50 glass border-b border-white/10">
        <div class="flex flex-col">
            <span class="text-[10px] text-gray-400 font-bold uppercase">Kral Puanı</span>
            <span id="score" class="text-xl font-black gold-text">0</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-[10px] text-gray-400 font-bold uppercase">Solana</span>
            <span id="sol-price" class="text-sm font-bold text-green-500">$...</span>
        </div>
    </div>

    <div id="tab-game" class="flex-1 w-full flex flex-col items-center justify-center p-6">
        <div class="relative">
            <div class="absolute -inset-4 bg-[#D4AF37]/20 blur-3xl rounded-full"></div>
            <button onclick="handleTap()" class="tap-btn w-48 h-48 rounded-full bg-black border-[6px] border-[#D4AF37] shadow-[0_0_40px_rgba(212,175,55,0.4)] text-7xl relative z-10">👑</button>
        </div>
        <p class="mt-8 text-[10px] text-gray-500 font-bold uppercase tracking-[0.2em]">VIP Seviye Atlamak İçin Tıkla</p>
    </div>

    <div id="tab-analiz" class="hidden flex-1 w-full p-6 space-y-4 overflow-y-auto">
        <h2 class="text-center font-['Orbitron'] gold-text text-lg">BALİNA RADARI</h2>
        <div class="glass p-4 rounded-3xl border border-white/10">
            <input type="text" id="caInput" placeholder="SOLANA KONTRAT (CA)..." class="w-full bg-transparent border-b border-[#D4AF37] p-2 text-xs outline-none text-white mb-4">
            <button onclick="runAnalysis()" class="w-full bg-[#D4AF37] text-black py-3 rounded-2xl font-black text-xs">ANALİZİ BAŞLAT</button>
        </div>
        <div id="analiz-result" class="space-y-3"></div>
    </div>

    <div id="tab-network" class="hidden flex-1 w-full p-6 text-center space-y-6">
        <h2 class="text-center font-['Orbitron'] gold-text text-lg italic">EKİBİNİ KUR</h2>
        <div class="glass p-6 rounded-3xl space-y-4">
            <p class="text-xs text-gray-400 uppercase font-bold tracking-widest">Senin Referans Linkin</p>
            <div class="bg-black/50 p-3 rounded-xl border border-white/5 text-[10px] break-all" id="refLink">t.me/memekralbot?start=12345</div>
            <button onclick="copyRef()" class="w-full bg-white text-black py-3 rounded-2xl font-black text-xs uppercase">LINKI KOPYALA</button>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="glass p-4 rounded-2xl">
                <p class="text-[8px] text-gray-500 uppercase">Ekip Üyesi</p>
                <p class="text-lg font-bold">14</p>
            </div>
            <div class="glass p-4 rounded-2xl">
                <p class="text-[8px] text-gray-500 uppercase">Kazanç</p>
                <p class="text-lg font-bold text-green-500">1.2 SOL</p>
            </div>
        </div>
    </div>

    <div class="w-[90%] mb-8 glass rounded-3xl p-2 flex justify-around border border-white/10">
        <button onclick="showTab('game')" class="p-3 text-xl opacity-50 hover:opacity-100 transition-all">🏠</button>
        <button onclick="showTab('analiz')" class="p-3 text-xl opacity-50 hover:opacity-100 transition-all">📡</button>
        <button onclick="showTab('network')" class="p-3 text-xl opacity-50 hover:opacity-100 transition-all">👥</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = parseInt(localStorage.getItem('kScore') || 0);
        document.getElementById('score').innerText = score;

        function handleTap() {
            score += 10;
            document.getElementById('score').innerText = score;
            localStorage.setItem('kScore', score);
        }

        function showTab(tabName) {
            ['game', 'analiz', 'network'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        }

        async function fetchSolPrice() {
            try {
                const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd');
                const d = await r.json();
                document.getElementById('sol-price').innerText = '$' + d.solana.usd.toFixed(2);
            } catch(e) {}
        }

        async function runAnalysis() {
            const ca = document.getElementById('caInput').value;
            const resDiv = document.getElementById('analiz-result');
            resDiv.innerHTML = `<p class="text-center animate-pulse text-[10px]">VERİLER ÇEKİLİYOR...</p>`;
            
            try {
                const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
                const d = await r.json();
                if(d.pairs) {
                    const p = d.pairs[0];
                    resDiv.innerHTML = `
                        <div class="glass p-4 rounded-2xl border-l-4 border-green-500">
                            <div class="flex justify-between">
                                <span class="font-black">${p.baseToken.symbol}</span>
                                <span class="text-green-500 font-bold">$${p.priceUsd}</span>
                            </div>
                            <div class="text-[10px] text-gray-500 mt-2">Likidite: $${p.liquidity.usd.toLocaleString()}</div>
                        </div>`;
                }
            } catch(e) { resDiv.innerHTML = "Hata oluştu!"; }
        }

        function copyRef() {
            const link = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(link);
            tg.showAlert("Referans linkin kopyalandı kanka!");
        }

        setInterval(fetchSolPrice, 30000);
        fetchSolPrice();
    </script>
</body>
</html>
