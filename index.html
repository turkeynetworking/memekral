<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEME KRAL | GLOBAL LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --dark: #050505; }
        body { background: #050505; color: white; font-family: sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .gold-glow { text-shadow: 0 0 15px var(--gold); }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { animation: marquee 25s linear infinite; }
    </style>
</head>
<body class="flex flex-col items-center select-none">

    <div class="w-full py-1.5 bg-black border-b border-[#D4AF37]/20 overflow-hidden whitespace-nowrap z-50">
        <div id="ticker" class="inline-block animate-marquee text-[10px] font-bold tracking-widest text-[#D4AF37] uppercase">
            CONNECTING TO SOLANA MAINNET... REAL-TIME DATA ACTIVE... NO RUG PULLS ALLOWED... 👑
        </div>
    </div>

    <header class="w-full p-4 flex justify-between items-center z-50">
        <div class="flex flex-col">
            <h1 class="font-['Orbitron'] text-sm font-black text-[#D4AF37]">MEME KRAL</h1>
            <div class="flex gap-2 mt-1">
                <button onclick="setLang('tr')" class="text-xs hover:scale-125 transition-all">🇹🇷</button>
                <button onclick="setLang('en')" class="text-xs hover:scale-125 transition-all">🇺🇸</button>
                <button onclick="setLang('es')" class="text-xs hover:scale-125 transition-all">🇪🇸</button>
            </div>
        </div>
        <div class="flex gap-2">
            <div class="glass px-3 py-1.5 rounded-xl text-[10px] font-bold text-[#0088cc]">⭐ <span id="stars-val">100</span></div>
            <div class="glass px-3 py-1.5 rounded-xl text-[10px] font-bold text-[#D4AF37]">SOL: <span id="sol-top">...</span></div>
        </div>
    </header>

    <div class="w-[90%] glass rounded-2xl p-3 mt-2">
        <h3 id="txt-radar" class="text-[9px] font-bold text-gray-500 uppercase mb-2">RADAR</h3>
        <div class="flex justify-between items-center text-[10px] bg-white/5 p-2 rounded-lg">
            <span class="text-gray-400">SOLANA (SOL/USDT)</span>
            <span id="sol-live" class="text-white font-black gold-glow">...</span>
        </div>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center w-full gap-4">
        <div id="score-val" class="text-4xl font-['Orbitron'] font-black text-[#D4AF37]">0</div>
        <button id="tap-btn" class="w-44 h-44 rounded-full bg-black border-[6px] border-[#D4AF37] shadow-[0_0_40px_rgba(212,175,55,0.2)] flex items-center justify-center text-7xl active:scale-90 transition-transform">
            👑
        </button>
    </main>

    <footer class="w-full px-6 pb-10 space-y-3 z-50">
        <div class="glass rounded-[25px] p-1.5 flex border border-[#D4AF37]/30">
            <input type="text" id="caInput" placeholder="..." class="flex-1 bg-transparent border-none outline-none px-4 py-2.5 text-xs text-[#D4AF37] font-bold uppercase">
            <button onclick="realAnaliz()" id="analizBtn" class="bg-[#D4AF37] text-black px-5 py-2.5 rounded-xl font-black text-[9px] uppercase tracking-tighter">ANALİZ</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="copyRef()" id="btn-ref" class="glass py-3 rounded-xl text-[9px] font-bold text-white uppercase tracking-widest">NETWORK 🔗</button>
            <button onclick="window.open('https://e-girisimci.com')" class="glass py-3 rounded-xl text-[9px] font-bold text-[#D4AF37] uppercase border-[#D4AF37]/30">GİRİŞİMCİ 🚀</button>
        </div>
    </footer>

    <div id="modal" style="display:none;" class="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-8 backdrop-blur-2xl">
        <div class="glass p-7 rounded-[35px] w-full max-w-sm border-2 border-[#D4AF37]">
            <div id="modal-content" class="text-center"></div>
            <button onclick="document.getElementById('modal').style.display='none'" id="btn-close" class="w-full bg-white/5 py-3 rounded-xl mt-4 font-bold text-[9px] text-gray-500 uppercase">KAPAT</button>
        </div>
    </div>

    <script>
        const i18n = {
            tr: { placeholder: "SOLANA CA YAPİŞTİR...", analiz: "ANALİZ ET", ref: "NETWORK LİNKİM", radar: "KRAL RADARI (CANLI)", close: "SİSTEME DÖN", alertRef: "Link Kopyalandı!", loading: "Ağ Taranıyor...", mTitle: "BALİNA RAPORU" },
            en: { placeholder: "PASTE SOLANA CA...", analiz: "ANALYZE", ref: "NETWORK LINK", radar: "KING RADAR (LIVE)", close: "BACK TO SYSTEM", alertRef: "Link Copied!", loading: "Scanning Network...", mTitle: "WHALE REPORT" },
            es: { placeholder: "PEGAR SOLANA CA...", analiz: "ANALIZAR", ref: "LINK DE RED", radar: "RADAR DEL REY", close: "VOLVER", alertRef: "¡Enlace Copiado!", loading: "Escaneando Red...", mTitle: "INFORME DE BALLENA" }
        };

        let currentLang = localStorage.getItem('kralLang') || 'tr';
        let score = parseInt(localStorage.getItem('kralScore') || 0);
        let stars = parseInt(localStorage.getItem('kralStars') || 100);

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('caInput').placeholder = t.placeholder;
            document.getElementById('analizBtn').innerText = t.analiz;
            document.getElementById('btn-ref').innerText = t.ref;
            document.getElementById('txt-radar').innerText = t.radar;
            document.getElementById('btn-close').innerText = t.close;
            document.getElementById('score-val').innerText = score;
            document.getElementById('stars-val').innerText = stars;
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('kralLang', lang);
            updateUI();
        }

        document.getElementById('tap-btn').addEventListener('click', (e) => {
            score += 10;
            document.getElementById('score-val').innerText = score;
            localStorage.setItem('kralScore', score);
        });

        async function realAnaliz() {
            const ca = document.getElementById('caInput').value.trim();
            const content = document.getElementById('modal-content');
            const t = i18n[currentLang];

            if(ca.length < 32) return;
            document.getElementById('modal').style.display = 'flex';
            content.innerHTML = `<p class='text-xs'>${t.loading}</p>`;

            try {
