<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<body class="bg-[#050505] text-white font-['Inter'] select-none">

            <div class="text-[100px] drop-shadow-[0_0_20px_rgba(212,175,55,0.5)]">👑</div>
        </div>

        <div class="relative mb-12">
            <button id="tap-btn" class="w-56 h-56 rounded-full bg-gradient-to-b from-[#1a1a1a] to-black border-4 border-[#D4AF37] shadow-[0_0_40px_rgba(212,175,55,0.2)] active:scale-95 transition-transform flex items-center justify-center relative overflow-hidden">
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(212,175,55,0.1)_0%,_transparent_70%)]"></div>
                <span class="text-7xl drop-shadow-lg">💰</span>
            </button>
            <div id="tap-anim-container" class="absolute inset-0 pointer-events-none"></div>
        </div>

        <div class="w-full max-w-sm bg-gradient-to-b from-[#111] to-[#000] border border-[#D4AF37]/30 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 p-2 text-[10px] text-[#D4AF37]/50 font-bold uppercase tracking-widest">v2.0 Beta</div>
            <h2 class="text-[#D4AF37] font-['Orbitron'] text-xs mb-4 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
                CANLI SOLANA ANALİZ
            </h2>
            <input type="text" id="sol-ca" placeholder="Solana CA (Contract Address) Yapıştır..."

            <button onclick="kralAnaliz()" class="w-full bg-[#D4AF37] text-black font-black py-4 rounded-xl hover:bg-[#FFD700] active:bg-[#B8860B] transition-all shadow-[0_4px_15px_rgba(212,175,55,0.4)] uppercase tracking-tighter">
                ANALİZ ET & RAPOR AL
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4 w-full max-w-sm mt-6">
            <div class="bg-[#111] border border-gray-800 p-4 rounded-2xl flex flex-col items-center justify-center text-center">
                <span class="text-2xl mb-1">👥</span>
                <span class="text-[10px] text-gray-400 uppercase">Ekibim</span>
                <span class="text-sm font-bold text-[#D4AF37]">0 ÜYE</span>
            </div>
            <div class="bg-[#111] border border-gray-800 p-4 rounded-2xl flex flex-col items-center justify-center text-center opacity-50">
                <span class="text-2xl mb-1">💎</span>
                <span class="text-[10px] text-gray-400 uppercase">VIP Durumu</span>
                <span class="text-sm font-bold text-gray-500">PASİF</span>
            </div>
        </div>

    </main>
