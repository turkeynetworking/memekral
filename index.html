<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEME KRAL GLOBAL v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --dark: #050505; --glass: rgba(255, 255, 255, 0.03); }
        body { background: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .gold-glow { text-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }
        .glass-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8); }
        @keyframes gold-pulse { 0% { box-shadow: 0 0 5px var(--gold); } 50% { box-shadow: 0 0 30px var(--gold); } 100% { box-shadow: 0 0 5px var(--gold); } }
        .tap-btn { animation: gold-pulse 3s infinite; transition: all 0.1s ease; }
        .tap-btn:active { transform: scale(0.85); filter: brightness(1.5); }
        @keyframes float-up { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-150px) scale(1.5); opacity: 0; } }
        .score-anim { position: absolute; font-family: 'Orbitron'; font-weight: 900; color: var(--gold); animation: float-up 0.8s forwards; pointer-events: none; }
    </style>
</head>
<body class="flex flex-col items-center select-none">

    <header class="w-full pt-4 px-6 flex justify-between items-center z-50">
        <div class="flex flex-col">
            <h1 class="font-['Syncopate'] text-sm gold-glow tracking-tighter uppercase">MEME <span class="text-white">KRAL</span></h1>
            <div class="flex gap-2 mt-1">
                <button onclick="changeLang('tr')" class="text-[10px] opacity-50 hover:opacity-100 transition-all">🇹🇷</button>
                <button onclick="changeLang('en')" class="text-[10px] opacity-50 hover:opacity-100 transition-all">🇺🇸</button>
                <button onclick="changeLang('es')" class="text-[10px] opacity-50 hover:opacity-100 transition-all">🇪🇸</button>
            </div>
        </div>
        <div class="flex gap-2">
            <div class="glass-card px-3 py-1.5 rounded-xl flex items-center gap-1.5 border-[#0088cc]">
                <span class="text-[#0088cc] text-xs">⭐</span>
                <span id="stars" class="font-['Orbitron'] text-xs font-black">100</span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center w-full gap-6">
        <div id="score-display" class="font-['Orbitron'] text-2xl font-black text-[#D4AF37] gold-glow">0</div>
        <div class="relative group">
            <div class="absolute -inset-10 bg-[#D4AF37] rounded-full blur-[80px] opacity-10"></div>
            <button id="main-tap" class="tap-btn w-48 h-48 rounded-full bg-black border-[6px] border-[#D4AF37] flex items-center justify-center text-7xl shadow-2xl relative z-10">
                🪙
            </button>
            <div id="anim-box" class="absolute inset-0"></div>
        </div>
    </main>

    <footer class="w-full px-6 pb-8 space-y-3 z-50">
        <div class="glass-card rounded-[25px] p-2 flex items-center gap-2">
            <input type="text" id="caInput" placeholder="..." 
                class="flex-1 bg-transparent border-none outline-none px-4 py-2 text-xs text-[#D4AF37] font-bold uppercase tracking-widest">
            <button onclick="kralAnaliz()" id="analizBtn" class="bg-[#D4AF37] text-black px-5 py-2.5 rounded-[18px] font-black text-[9px] uppercase tracking-tighter">
                ANALİZ
            </button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="kopyalaReferans()" id="refBtn" class="glass-card p-3 rounded-2xl flex flex-col items-center border-white/10 hover:border-[#D4AF37]/40 transition-all">
                <span id="txt-ref-title" class="text-gray-500 text-[8px] uppercase font-bold mb-1">NETWORK</span>
                <span id="txt-ref-action" class="text-[10px] font-['Orbitron'] text-white uppercase">KOPYALA</span>
            </button>
            <div class="glass-card p-3 rounded-2xl flex flex-col items-center">
                <span id="txt-vip-title" class="text-[#0088cc] text-[8px] uppercase font-bold mb-1">VIP STATUS</span>
                <span id="txt-vip-val" class="text-[10px] font-['Orbitron'] text-[#0088cc] gold-glow uppercase italic">ACTIVE</span>
            </div>
        </div>
    </main>

    <div id="modal" style="display:none;" class="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-8 backdrop-blur-2xl">
        <div class="glass-card p-7 rounded-[35px] w-full max-w-xs border-[#D4AF37] border-2">
            <div class="text-center mb-5">
                <div class="text-4xl mb-1">🐋</div>
                <h2 id="modal-title" class="font-['Orbitron'] text-md text-[#D4AF37]">REPORT</h2>
            </div>
            <div id="modal-body" class="space-y-3 mb-6 bg-black/40 p-4 rounded-xl text-[10px]"></div>
            <button onclick="closeModal()" id="modal-close" class="w-full bg-white/5 py-3 rounded-xl mb-2 text-[10px] font-bold text-gray-400 uppercase">KAPAT</button>
            <button onclick="satinAlVIPRapor()" id="vipBtn" class="w-full bg-[#0088cc] text-white py-3 rounded-xl font-black text-[10px] uppercase">VIP REPORT (50 ⭐)</button>
        </div>
    </div>

    <script>
        const i18n = {
            tr: {
                placeholder: "SOLANA CA YAPİŞTİR...", analiz: "ANALİZ ET", 
                refTitle: "NETWORK LİNKİM", refAction: "KOPYALA 🔗", 
                vipTitle: "VIP DURUMU", vipVal: "AKTİF",
                modalTitle: "BALİNA RAPORU", modalClose: "SİSTEME DÖN",
                vipBtn: "DETAYLI VIP RAPOR (50 ⭐)",
                alertRef: "Link Kopyalandı Kral!", alertStars: "Yetersiz Stars ⭐ Bakiyesi!"
            },
            en: {
                placeholder: "PASTE SOLANA CA...", analiz: "ANALYZE", 
                refTitle: "NETWORK LINK", refAction: "COPY 🔗", 
                vipTitle: "VIP STATUS", vipVal: "ACTIVE",
                modalTitle: "WHALE REPORT", modalClose: "BACK TO SYSTEM",
                vipBtn: "DETAILED VIP REPORT (50 ⭐)",
                alertRef: "Link Copied King!", alertStars: "Insufficient Stars ⭐!"
            },
            es: {
                placeholder: "PEGAR SOLANA CA...", analiz: "ANALIZAR", 
                refTitle: "LINK DE RED", refAction: "COPIAR 🔗", 
                vipTitle: "ESTADO VIP", vipVal: "ACTIVO",
                modalTitle: "INFORME DE BALLENA", modalClose: "VOLVER",
                vipBtn: "INFORME VIP DETALLADO (50 ⭐)",
                alertRef: "¡Enlace Copiado Rey!", alertStars: "¡Stars Insuficientes ⭐!"
            }
        };

        let currentLang = localStorage.getItem('kralLang') || 'tr';
        let score = localStorage.getItem('kralScore') ? parseInt(localStorage.getItem('kralScore')) : 0;
        let stars = localStorage.getItem('kralStars') ? parseInt(localStorage.getItem('kralStars')) : 100;

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('caInput').placeholder = t.placeholder;
            document.getElementById('analizBtn').innerText = t.analiz;
            document.getElementById('txt-ref-title').innerText = t.refTitle;
            document.getElementById('txt-ref-action').innerText = t.refAction;
            document.getElementById('txt-vip-title').innerText = t.vipTitle;
            document.getElementById('txt-vip-val').innerText = t.vipVal;
            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('modal-close').innerText = t.modalClose;
            document.getElementById('vipBtn').innerText = t.vipBtn;
        }

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('kralLang', lang);
            updateUI();
        }

        // Dokun-Kazan & Diğer Fonksiyonlar (Aynı Mantık)
        document.getElementById('main-tap').addEventListener('click', (e) => {
            score += 10;
            document.getElementById('score-display').innerText = score;
            localStorage.setItem('kralScore', score);
            const anim = document.createElement('div');
            anim.innerText = "+10"; anim.className = "score-anim";
            anim.style.left = e.clientX + 'px'; anim.style.top = e.clientY + 'px';
            document.getElementById('anim-box').appendChild(anim);
            setTimeout(() => anim.remove(), 800);
        });

        async function kralAnaliz() {
            const ca = document.getElementById('caInput').value;
            if(ca.length < 30) return;
            document.getElementById('modal-body').innerHTML = `<p class="text-center py-4">Scanning Blockchain... ⚡</p>`;
            document.getElementById('modal').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('modal-body').innerHTML = `<div class="flex justify-between"><span>Security:</span><span class="text-green-500 font-bold">CLEAN</span></div><hr class="border-white/5 my-2"><p class="italic text-gray-400">Deep analysis required for whale movements.</p>`;
            }, 1000);
        }

        function kopyalaReferans() {
            navigator.clipboard.writeText(`https://t.me/MemeKralBot?start=ref`).then(() => {
                alert(i18n[currentLang].alertRef);
            });
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        // İlk yükleme
        updateUI();
        document.getElementById('score-display').innerText = score;
        document.getElementById('stars').innerText = stars;
    </script>
</body>
</html>
